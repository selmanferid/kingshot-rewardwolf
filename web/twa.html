<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>WLF Rewardwolf</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #1c1c1e);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --btn: var(--tg-theme-button-color, #0a84ff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --amber: #ff9f0a; --green: #30d158; --red: #ff453a; --blue: #0a84ff;
    --surface: rgba(255,255,255,0.07); --border: rgba(255,255,255,0.1);
    --r: 12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;}
  .app{display:flex;flex-direction:column;height:100dvh;}
  ::-webkit-scrollbar{display:none;}

  .navbar{background:var(--secondary-bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);flex-shrink:0;}
  .navbar-title{font-size:17px;font-weight:600;letter-spacing:-.3px;}
  .navbar-sub{font-size:12px;color:var(--hint);}
  .daemon-pill{display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:500;}
  .pulse{width:7px;height:7px;border-radius:50%;}
  .pulse.on{background:var(--green);animation:glow 2s infinite;}
  .pulse.off{background:var(--red);}
  @keyframes glow{0%,100%{opacity:1}50%{opacity:.5}}

  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}

  .tabbar{background:var(--secondary-bg);border-top:.5px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0);flex-shrink:0;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;cursor:pointer;gap:2px;font-size:10px;font-weight:500;color:var(--hint);}
  .tab.active{color:var(--btn);}
  .tab-ico{font-size:20px;transition:transform .1s;}
  .tab.active .tab-ico{transform:scale(1.1);}

  .sec-hdr{padding:20px 16px 8px;font-size:13px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;}
  .list{margin:0 16px 8px;background:var(--surface);border-radius:var(--r);overflow:hidden;}
  .row{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:.5px solid var(--border);min-height:52px;cursor:pointer;}
  .row:last-child{border-bottom:none;}
  .row-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .row-body{flex:1;min-width:0;}
  .row-title{font-size:16px;}
  .row-sub{font-size:13px;color:var(--hint);margin-top:1px;}
  .row-right{flex-shrink:0;color:var(--hint);font-size:18px;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 8px;}
  .stat{background:var(--surface);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;}
  .stat.g::before{background:var(--green);}
  .stat.a::before{background:var(--amber);}
  .stat.r::before{background:var(--red);}
  .stat.b::before{background:var(--blue);}
  .stat-lbl{font-size:12px;color:var(--hint);font-weight:500;}
  .stat-val{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1;margin:4px 0 2px;}
  .stat.g .stat-val{color:var(--green);}
  .stat.a .stat-val{color:var(--amber);}
  .stat.r .stat-val{color:var(--red);}
  .stat.b .stat-val{color:var(--blue);}
  .stat-sub{font-size:11px;color:var(--hint);}

  .dist-card{margin:12px 16px 4px;background:linear-gradient(135deg,rgba(255,159,10,.15),rgba(255,159,10,.05));border:1px solid rgba(255,159,10,.25);border-radius:var(--r);padding:14px;}
  .dist-live{display:inline-flex;align-items:center;gap:4px;background:rgba(255,159,10,.2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--amber);margin-bottom:8px;}
  .dist-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:glow 1s infinite;}
  .dist-code{font-size:22px;font-weight:700;color:var(--amber);letter-spacing:-.5px;}
  .dist-info{font-size:13px;color:var(--hint);margin-top:2px;}
  .dist-nums{display:flex;gap:20px;margin-top:10px;}
  .dn-val{font-size:22px;font-weight:700;}
  .dn-lbl{font-size:10px;color:var(--hint);}

  .hbar-row{display:flex;align-items:center;gap:10px;padding:8px 16px;}
  .hbar-lbl{font-size:13px;color:var(--hint);width:36px;}
  .hbar-bg{flex:1;height:4px;background:var(--surface);border-radius:2px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:2px;transition:width .4s;}
  .hbar-val{font-size:13px;font-weight:500;width:42px;text-align:right;}

  .pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;}
  .pill.s{background:rgba(48,209,88,.15);color:var(--green);}
  .pill.u{background:rgba(255,159,10,.15);color:var(--amber);}
  .pill.f{background:rgba(255,69,58,.15);color:var(--red);}
  .pill.p{background:rgba(10,132,255,.15);color:var(--blue);}

  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 8px;}
  .ctrl{background:var(--surface);border:none;border-radius:var(--r);padding:18px 12px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;transition:opacity .15s,transform .1s;}
  .ctrl:active{opacity:.7;transform:scale(.97);}
  .ctrl:disabled{opacity:.4;}
  .ctrl-ico{font-size:26px;}

  .av{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--hint);flex-shrink:0;}
  .tag-vip{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;background:rgba(255,159,10,.2);color:var(--amber);margin-right:3px;}

  .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--btn);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading-c{display:flex;align-items:center;justify-content:center;padding:48px;}
  .empty-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:8px;}
  .empty-ico{font-size:44px;}
  .empty-txt{font-size:15px;color:var(--hint);text-align:center;}

  .login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .login-logo{font-size:60px;margin-bottom:6px;}
  .login-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px;}
  .login-sub{font-size:15px;color:var(--hint);margin-bottom:32px;}
  .login-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;}
  .input-group{background:var(--surface);border-radius:var(--r);overflow:hidden;}
  .inp{width:100%;padding:14px 16px;background:transparent;border:none;border-bottom:.5px solid var(--border);color:var(--text);font-size:16px;outline:none;}
  .inp:last-child{border-bottom:none;}
  .inp::placeholder{color:var(--hint);}
  .btn-login{width:100%;padding:14px;background:var(--btn);border:none;border-radius:var(--r);color:var(--btn-text);font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;}
  .login-err{font-size:13px;color:var(--red);text-align:center;min-height:18px;}

  .page-in{animation:pi .18s ease;}
  @keyframes pi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const API='';
let tok=localStorage.getItem('wlf_tok')||'';
async function req(path,opts={}){
  const h={...(opts.headers||{})};
  if(tok)h['Authorization']='Bearer '+tok;
  if(opts.json){h['Content-Type']='application/json';opts.body=JSON.stringify(opts.json);delete opts.json;}
  const r=await fetch(API+path,{...opts,headers:h});
  if(r.status===401){tok='';localStorage.removeItem('wlf_tok');render();return null;}
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
function hap(t='light'){tg?.HapticFeedback?.impactOccurred(t);}
const S={page:'home',authed:!!tok,dash:null,health:null,ds:null,players:null,codes:null,L:{},lu:'',lp:'',le:''};
let timer=null;
async function loadHome(){
  const[d,h,ds]=await Promise.all([req('/api/dashboard').catch(()=>null),req('/api/health').catch(()=>null),req('/api/daemon/status').catch(()=>null)]);
  S.dash=d;S.health=h;S.ds=ds;render();
}
async function loadPlayers(){S.players=await req('/api/players').catch(()=>[]);render();}
async function loadCodes(){S.codes=await req('/api/codes').catch(()=>[]);render();}
async function loadDs(){S.ds=await req('/api/daemon/status').catch(()=>null);render();}
async function doLogin(){
  S.le='';render();
  const body=new URLSearchParams({username:S.lu,password:S.lp});
  try{
    const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!r.ok)throw new Error('Invalid credentials');
    const d=await r.json();tok=d.access_token;localStorage.setItem('wlf_tok',tok);
    S.authed=true;hap('medium');await loadHome();startTimer();render();
  }catch(e){S.le=e.message;hap('error');render();}
}
async function daemonAct(a){
  hap('medium');S.L[a]=true;render();
  try{
    await req('/api/daemon/'+a,{method:'POST'});
    tg?.showPopup({message:a.charAt(0).toUpperCase()+a.slice(1)+' triggered!'});
    setTimeout(async()=>{S.ds=await req('/api/daemon/status').catch(()=>null);S.L[a]=false;render();},2500);
  }catch(e){tg?.showAlert(e.message)||alert(e.message);S.L[a]=false;render();}
}
async function syncSheets(){
  hap('light');S.L.sync=true;render();
  try{await req('/api/sync/sheets',{method:'POST'});tg?.showPopup({message:'Sheets synced!'});}
  catch{tg?.showAlert('Sync failed');}
  S.L.sync=false;render();
}
function startTimer(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(S.page==='home')loadHome();},15000);}
function navTo(p){hap('light');S.page=p;render();if(p==='home'&&!S.dash)loadHome();if(p==='players'&&!S.players)loadPlayers();if(p==='codes'&&!S.codes)loadCodes();if(p==='daemon')loadDs();}
function logout(){tok='';localStorage.removeItem('wlf_tok');S.authed=false;S.dash=null;S.players=null;S.codes=null;if(timer)clearInterval(timer);render();}
function inits(n){return(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function pill(s){const m={SUCCESS:['s','✓'],ALREADY_USED:['u','⚠'],FAILED:['f','✕']};const[c,i]=m[s]||['p',s];return`<span class="pill ${c}">${i} ${s==='ALREADY_USED'?'Used':s.charAt(0)+s.slice(1).toLowerCase()}</span>`;}

function pageHome(){
  const d=S.dash,h=S.health,ds=S.ds;
  if(!d)return`<div class="loading-c"><div class="spin"></div></div>`;
  const tot=(d.success||0)+(d.already_used||0)+(d.failed||0);
  const pct=tot?Math.round((d.success||0)/tot*100):0;
  return`
    ${d.dist_active?`<div class="dist-card">
      <div class="dist-live"><span class="dist-dot"></span>LIVE</div>
      <div class="dist-code">${d.dist_code||''}</div>
      <div class="dist-info">${d.dist_player||''} · ${d.dist_index||0}/${d.total_players||0}</div>
      <div class="dist-nums">
        <div><div class="dn-val" style="color:var(--green)">${d.dist_success||0}</div><div class="dn-lbl">Success</div></div>
        <div><div class="dn-val" style="color:var(--amber)">${d.dist_already_used||0}</div><div class="dn-lbl">Used</div></div>
        <div><div class="dn-val" style="color:var(--red)">${d.dist_failed||0}</div><div class="dn-lbl">Failed</div></div>
      </div></div>`:''}
    <div class="sec-hdr">Overview</div>
    <div class="stats-grid">
      <div class="stat g"><div class="stat-lbl">Success</div><div class="stat-val">${d.success||0}</div><div class="stat-sub">${pct}% rate</div></div>
      <div class="stat a"><div class="stat-lbl">Already Used</div><div class="stat-val">${d.already_used||0}</div><div class="stat-sub">Previously claimed</div></div>
      <div class="stat r"><div class="stat-lbl">Failed</div><div class="stat-val">${d.failed||0}</div><div class="stat-sub">Pending retry</div></div>
      <div class="stat b"><div class="stat-lbl">Players</div><div class="stat-val">${d.total_players||0}</div><div class="stat-sub">${d.vip_count||0} VIP</div></div>
    </div>
    ${h?`<div class="sec-hdr">System</div><div class="list">
      ${[['CPU',h.cpu_load,100,'%'],['RAM',h.ram_percent,100,'%'],['Temp',h.temp_c,90,'°C']].map(([l,v,mx,u])=>`
        <div class="hbar-row"><span class="hbar-lbl">${l}</span>
          <div class="hbar-bg"><div class="hbar-fill" style="width:${Math.min(v/mx*100,100)}%;background:${v>80?'var(--red)':v>60?'var(--amber)':'var(--green)'}"></div></div>
          <span class="hbar-val" style="color:${v>80?'var(--red)':v>60?'var(--amber)':'var(--green)'}">${v}${u}</span>
        </div>`).join('')}</div>`:''}
    <div class="sec-hdr">Actions</div>
    <div class="list">
      <div class="row" onclick="syncSheets()">
        <div class="row-ico" style="background:rgba(10,132,255,.15)">☁</div>
        <div class="row-body"><div class="row-title">Sync Google Sheets</div><div class="row-sub">Update player list</div></div>
        <div class="row-right">${S.L.sync?'<div class="spin"></div>':'›'}</div>
      </div>
      <div class="row" onclick="navTo('daemon')">
        <div class="row-ico" style="background:rgba(255,159,10,.15)">⚙</div>
        <div class="row-body"><div class="row-title">Daemon Control</div><div class="row-sub">Restart, rebuild</div></div>
        <div class="row-right">›</div>
      </div>
    </div>`;
}

function pagePlayers(){
  if(!S.players)return`<div class="loading-c"><div class="spin"></div></div>`;
  if(!S.players.length)return`<div class="empty-c"><div class="empty-ico">👥</div><div class="empty-txt">No players</div></div>`;
  return`<div class="sec-hdr">${S.players.length} Players</div>
    <div class="list">${S.players.map(p=>`
      <div class="row" style="cursor:default">
        <div class="av">${inits(p.username)}</div>
        <div class="row-body">
          <div class="row-title">${p.is_vip?'<span class="tag-vip">VIP</span>':''}${p.username||p.player_id}</div>
          <div class="row-sub">${p.player_id}</div>
        </div>
        <span class="pill ${p.is_active?'s':'f'}">${p.is_active?'Active':'Off'}</span>
      </div>`).join('')}</div>`;
}

function pageCodes(){
  if(!S.codes)return`<div class="loading-c"><div class="spin"></div></div>`;
  if(!S.codes.length)return`<div class="empty-c"><div class="empty-ico">🔑</div><div class="empty-txt">No codes</div></div>`;
  return`<div class="sec-hdr">${S.codes.length} Codes</div>
    <div class="list">${S.codes.map(c=>`
      <div class="row" style="flex-direction:column;align-items:flex-start;gap:8px;cursor:default">
        <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
          <div style="font-size:17px;font-weight:700;color:var(--amber)">${c.code}</div>
          <span class="pill ${c.is_completed?'s':'p'}">${c.is_completed?'✓ Done':'Active'}</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="pill s">✓ ${c.success_count||0}</span>
          <span class="pill u">⚠ ${c.already_used_count||0}</span>
          <span class="pill f">✕ ${c.failed_count||0}</span>
        </div>
        ${c.expires_at?`<div style="font-size:12px;color:var(--hint)">Expires ${new Date(c.expires_at).toLocaleDateString()}</div>`:''}
      </div>`).join('')}</div>`;
}

function pageDaemon(){
  const ds=S.ds,run=ds?.running,L=S.L;
  return`
    <div class="sec-hdr">Status</div>
    <div class="list">
      <div class="row" style="cursor:default">
        <div class="row-ico" style="background:${run?'rgba(48,209,88,.15)':'rgba(255,69,58,.15)'}">${run?'🟢':'🔴'}</div>
        <div class="row-body"><div class="row-title">Daemon</div><div class="row-sub" style="color:${run?'var(--green)':'var(--red)'}">${ds?.status?.toUpperCase()||'UNKNOWN'}</div></div>
        <button onclick="loadDs()" style="background:transparent;border:none;color:var(--hint);font-size:20px;cursor:pointer;padding:4px">↻</button>
      </div>
    </div>
    <div class="sec-hdr">Controls</div>
    <div class="btn-grid">
      <button class="ctrl" onclick="daemonAct('restart')" ${L.restart?'disabled':''}>
        <span class="ctrl-ico">${L.restart?'<div class="spin"></div>':'↺'}</span>
        <span style="color:var(--amber)">Restart</span>
      </button>
      <button class="ctrl" onclick="daemonAct('rebuild')" ${L.rebuild?'disabled':''}>
        <span class="ctrl-ico">${L.rebuild?'<div class="spin"></div>':'⚙'}</span>
        <span style="color:var(--blue)">Rebuild</span>
      </button>
    </div>
    <div class="sec-hdr">More</div>
    <div class="list">
      <div class="row" onclick="syncSheets()">
        <div class="row-ico" style="background:rgba(10,132,255,.15)">☁</div>
        <div class="row-body"><div class="row-title">Sync Google Sheets</div></div>
        <div class="row-right">${L.sync?'<div class="spin"></div>':'›'}</div>
      </div>
      <div class="row" onclick="window.open('https://gift.ks-wolfpack.com','_blank')">
        <div class="row-ico" style="background:rgba(48,209,88,.15)">🖥</div>
        <div class="row-body"><div class="row-title">Full Dashboard</div><div class="row-sub">Open in browser</div></div>
        <div class="row-right">›</div>
      </div>
      <div class="row" onclick="logout()">
        <div class="row-ico" style="background:rgba(255,69,58,.15)">⬅</div>
        <div class="row-body"><div class="row-title" style="color:var(--red)">Logout</div></div>
      </div>
    </div>`;
}

function render(){
  const root=document.getElementById('root');
  if(!S.authed){
    root.innerHTML=`<div class="login-page">
      <div class="login-logo">🐺</div>
      <div class="login-title">Rewardwolf</div>
      <div class="login-sub">WLF Operations Center</div>
      <div class="login-form">
        <div class="input-group">
          <input class="inp" id="lu" type="text" placeholder="Username" value="${S.lu}" oninput="S.lu=this.value" autocomplete="username"/>
          <input class="inp" id="lp" type="password" placeholder="Password" value="${S.lp}" oninput="S.lp=this.value" onkeydown="if(event.key==='Enter')doLogin()" autocomplete="current-password"/>
        </div>
        <button class="btn-login" onclick="doLogin()">Sign In</button>
        <div class="login-err">${S.le}</div>
      </div></div>`;
    return;
  }
  const tabs=[{id:'home',ico:'📊',lbl:'Overview'},{id:'players',ico:'👥',lbl:'Players'},{id:'codes',ico:'🎁',lbl:'Codes'},{id:'daemon',ico:'⚙️',lbl:'Daemon'}];
  const pages={home:pageHome,players:pagePlayers,codes:pageCodes,daemon:pageDaemon};
  const content=(pages[S.page]||pageHome)();
  const ds=S.ds;
  root.innerHTML=`<div class="app">
    <div class="navbar">
      <div><div class="navbar-title">🐺 Rewardwolf</div><div class="navbar-sub">WLF Operations</div></div>
      <div class="daemon-pill">
        <div class="pulse ${ds?.running?'on':'off'}"></div>
        <span style="color:${ds?.running?'var(--green)':'var(--red)'}">${ds?.status?.toUpperCase()||'...'}</span>
      </div>
    </div>
    <div class="content"><div class="page-in">${content}</div></div>
    <div class="tabbar">${tabs.map(t=>`<div class="tab ${S.page===t.id?'active':''}" onclick="navTo('${t.id}')"><div class="tab-ico">${t.ico}</div>${t.lbl}</div>`).join('')}</div>
  </div>`;
}

render();
if(S.authed){loadHome();startTimer();}
</script>
</body>
</html>
